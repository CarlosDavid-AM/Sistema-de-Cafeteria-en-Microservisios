spring:
  application:
    name: inventario

  datasource:
    url: jdbc:postgresql://localhost:5432/cafeteria_inventory
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
  servlet:
    context-path: /api
