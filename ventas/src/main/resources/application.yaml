spring:
  application:
    name: servicio-ventas

  datasource:
    url: jdbc:postgresql://localhost:5432/cafeteria_ventas
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083
  servlet:
    context-path: /api


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/